<style>
  :root{
    --background:#0B111A; --surface:#12151E; --primary:#fff;
    --accent-secondary:#19D3E6;
    --text-primary:#fff; --text-secondary:#94A3B8;
    --border-color:#2B3A4C;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--background); color:var(--text-primary);
    font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-secondary);color:#0B111A}

  main{
    position:relative; height:100vh; height:100dvh; width:100%;
    padding:8px; display:flex; align-items:center; justify-content:center;
    background-color:var(--background);
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:80px 80px,80px 80px,16px 16px,16px 16px;
    background-position:center center;
    overflow:hidden;
  }
  @media (min-width:640px){ main{padding:24px} }
  @media (min-width:768px){ main{padding:40px} }
  main::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(10,11,16,.85) 100%);
    z-index:1;
  }
  .orb{position:absolute; width:520px; height:520px; border-radius:50%; filter:blur(60px); pointer-events:none}
  .orb-a{top:-128px; right:-128px; background:var(--accent-secondary); opacity:.08}
  .orb-b{bottom:-160px; left:-160px; background:var(--accent-secondary); opacity:.06}

  .frame{
    position:relative; z-index:10;
    width:100%; max-width:1280px; height:100%; max-height:820px;
    min-width:0;
    border:1px solid var(--border-color);
    background:rgba(18,21,30,.4);
    backdrop-filter:blur(2px);
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr) auto auto;
  }
  @media (min-width:768px){
    .frame{
      grid-template-columns:repeat(12, minmax(0,1fr));
      grid-template-rows:auto minmax(0,1fr) auto auto;
    }
    .top-strip{grid-column:span 12}
    .mono{grid-column:span 12}
    .info{grid-column:span 8}
    .actions{grid-column:span 4}
    .footer{grid-column:span 12}
  }

  .cross{position:absolute; width:14px; height:14px; opacity:.8}
  .cross::before, .cross::after{content:""; position:absolute; background:var(--accent-secondary)}
  .cross::before{left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%)}
  .cross::after{top:50%; left:0; right:0; height:1px; transform:translateY(-50%)}
  .cross.tl{top:-7px; left:-7px} .cross.tr{top:-7px; right:-7px}
  .cross.bl{bottom:-7px; left:-7px} .cross.br{bottom:-7px; right:-7px}

  /* TOP STRIP */
  .top-strip{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--border-color);
    font-size:9px; text-transform:uppercase; letter-spacing:.2em; color:var(--text-secondary);
  }
  @media(min-width:768px){ .top-strip{padding:12px 32px; font-size:12px} }
  .top-strip .cyan{color:var(--accent-secondary)}
  .top-strip .white{color:rgba(255,255,255,.8)}
  .top-strip .meta{display:none; gap:24px}
  @media(min-width:600px){ .top-strip .meta{display:flex} }
  .top-strip .left,.top-strip .right{display:flex; align-items:center; gap:12px}
  .dot{display:inline-block; width:7px; height:7px; background:var(--accent-secondary); border-radius:50%; animation:tick 1.4s steps(1) infinite}
  @keyframes tick{0%,45%,100%{opacity:1}50%,95%{opacity:0}}
  .tabular{font-variant-numeric:tabular-nums}

  /* MONOGRAM SECTION */
  .mono{
    position:relative; overflow:hidden; padding:16px;
    border-bottom:1px solid var(--border-color);
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  @media(min-width:768px){ .mono{padding:48px} }
  .ruler{
    display:none; position:absolute; top:0; bottom:0; width:32px;
    flex-direction:column; justify-content:space-between; align-items:center;
    padding:16px 0; font-size:9px; letter-spacing:.15em; color:var(--text-secondary);
  }
  @media(min-width:768px){ .ruler{display:flex} }
  .ruler.l{left:0; border-right:1px solid var(--border-color)}
  .ruler.r{right:0; border-left:1px solid var(--border-color)}

  .ap{
    font-family:"Cabinet Grotesk","Inter",system-ui,sans-serif;
    font-weight:900; line-height:1; user-select:none;
    color:transparent;
    -webkit-text-stroke:1.5px rgba(255,255,255,.9);
    letter-spacing:-.05em;
    font-size:min(38vw, 42vh);
    animation:apin 1.2s cubic-bezier(.16,1,.3,1);
    margin:0;
  }
  @media(min-width:768px){ .ap{font-size:min(22vw, 38vh)} }
  @media(min-width:1024px){ .ap{font-size:min(16rem, 38vh)} }
  @keyframes apin{from{opacity:0; transform:scale(1.05)} to{opacity:1; transform:scale(1)}}

  .dim{
    display:none; position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    align-items:center; gap:8px; font-size:10px; letter-spacing:.15em; color:var(--text-secondary);
  }
  @media(min-width:768px){ .dim{display:flex} }
  .dim .l{width:96px; height:1px; background:var(--text-secondary)}

  /* INFO SECTION */
  .info{
    padding:16px 20px; border-bottom:1px solid var(--border-color);
    display:flex; flex-direction:column; justify-content:flex-end;
    animation:fadeUp .6s .45s both;
    min-width:0;
  }
  @media(min-width:768px){ .info{padding:40px; border-bottom:none; border-right:1px solid var(--border-color)} }
  .info h1{
    font-family:"Cabinet Grotesk","Inter",system-ui,sans-serif;
    font-weight:700; text-transform:uppercase; color:#fff;
    font-size:clamp(1.5rem, 6vw, 3.75rem);
    line-height:.95; letter-spacing:-.03em;
    margin:0;
  }

  /* ACTIONS */
  .actions{
    padding:16px 20px; display:flex; flex-direction:column;
    justify-content:flex-end; gap:10px;
    animation:fadeUp .6s .6s both;
    min-width:0; width:100%;
  }
  @media(min-width:768px){ .actions{padding:40px; gap:12px} }
  @keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)}}

  .btn{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 18px; border:1px solid var(--border-color);
    background:transparent; color:#fff; text-decoration:none;
    font-size:11px; text-transform:uppercase; letter-spacing:.2em;
    transition:background .15s, color .15s, border-color .15s;
    cursor:pointer;
    width:100%; max-width:100%; min-width:0;
    box-sizing:border-box; gap:8px;
  }
  @media(min-width:640px){ .btn{font-size:13px; padding:16px 20px} }
  .btn .l{display:flex; align-items:center; gap:10px; min-width:0}
  .btn .arrow{transition:transform .15s; flex-shrink:0}
  .btn:hover .arrow{transform:translate(4px,-4px)}
  .btn-linkedin:hover{background:#fff; color:#000}
  .btn-email:hover{background:var(--accent-secondary); border-color:var(--accent-secondary); color:#0B111A}
  .btn .ico{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; flex-shrink:0;
  }
  .btn:focus-visible{outline:2px solid var(--accent-secondary); outline-offset:3px}

  /* FOOTER */
  .footer{
    display:flex; flex-direction:row; justify-content:space-between; align-items:center;
    gap:4px; padding:10px 16px; border-top:1px solid var(--border-color);
    background:rgba(10,11,16,.8);
    font-size:9px; text-transform:uppercase; letter-spacing:.15em;
    min-width:0;
  }
  @media(max-width:767px){
    .footer{gap:8px; flex-wrap:wrap}
  }
  @media(min-width:768px){ .footer{padding:12px 32px; font-size:11px; letter-spacing:.2em} }
  .footer .rev{color:var(--text-secondary); display:flex; align-items:center; gap:8px; min-width:0}
  .footer .rev .cyan{color:var(--accent-secondary)}
  .footer .rev .sep{display:none}
  @media(min-width:600px){ .footer .rev .sep{display:inline} }
  .footer .copy{color:rgba(255,255,255,.5); text-align:right; min-width:0}
  .footer .copy .nw{white-space:nowrap}
  .footer .copy .csep{display:none}
  @media (min-width:460px) and (max-width:767px), (min-width:820px){ .footer .copy .csep{display:inline} }
  @media(min-width:480px){ .footer .copy{color:#fff} }

  /* LAY-320: shrink cards/footer in-grid instead of clipping arrows */
  @media (max-width: 375px){
    .footer .copy .nw{white-space:normal}
    .btn{letter-spacing:.12em; padding-left:12px; padding-right:12px}
  }

  /* Short viewports (phones in landscape) — the monogram's vh-based
     size assumes a tall layout; on a short screen the fixed rows above
     and below it (top strip, name, buttons, footer) leave almost no
     room, clipping the "AP" glyph. Shrink everything else and cap the
     glyph to what's actually left. */
  @media (max-height:500px){
    main{padding:6px}
    .top-strip{padding:6px 14px}
    .mono{padding:6px}
    .ruler,.dim{display:none}
    .ap{font-size:min(22vw,20vh)}
    .info{padding:8px 16px}
    .info h1{font-size:1.15rem}
    .actions{padding:8px 16px; gap:6px}
    .btn{padding:8px 14px; font-size:10px}
    .footer{padding:6px 14px; font-size:8px}
  }

  /* Reduced motion */
  @media(prefers-reduced-motion:reduce){
    .dot{animation:none}
    .ap,.info,.actions{animation:none}
  }
</style>
</head>
<body>
<main>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="frame">
    <span class="cross tl"></span>
    <span class="cross tr"></span>
    <span class="cross bl"></span>
    <span class="cross br"></span>

    <div class="top-strip">
      <div class="left">
        <span class="cyan">DWG_NO</span>
        <span class="white">AP-001.CA</span>
      </div>
      <div class="meta">
        <span>SHEET 01/01</span>
        <span>SCALE 1:1</span>
        <span>UNIT MM</span>
      </div>
      <div class="right">
        <span class="dot"></span>
        <span class="tabular" id="clock">--:--:--</span>
        <span>MT</span>
      </div>
    </div>

    <div class="mono">
      <div class="ruler l"><span>A</span><span>B</span><span>C</span><span>D</span></div>
      <div class="ruler r"><span>1</span><span>2</span><span>3</span><span>4</span></div>
      <div class="ap" aria-hidden="true">AP</div>
      <div class="dim">
        <span class="l"></span><span>&#216; 001</span><span class="l"></span>
      </div>
    </div>

    <section class="info">
      <h1>Anjan Patel</h1>
    </section>

    <section class="actions">
      <a class="btn btn-linkedin"
         href="https://www.linkedin.com/in/anjanspatel"
         target="_blank"
         rel="me noopener noreferrer"
         aria-label="LinkedIn profile (opens in new tab)">
        <span class="l">
          <span class="ico" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" focusable="false"><rect x="2" y="2" width="20" height="20" fill="#fff"/><path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.852 3.37-1.852 3.601 0 4.267 2.37 4.267 5.455v6.288zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zM7.119 20.452H3.554V9h3.565v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </span>
          LinkedIn
        </span>
        <svg class="arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>

      <a class="btn btn-email"
         href="mailto:anjan@anjanpatel.ca"
         aria-label="Email Anjan Patel">
        <span class="l">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></svg></span>
          Email
        </span>
        <svg class="arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
    </section>

    <footer class="footer">
      <div class="rev">
        <span class="cyan">SYS.REV</span>
        <span>2026.1.1</span>
        <span class="sep">·</span>
        <span class="sep">anjanpatel.ca</span>
      </div>
      <div class="copy" id="copyright"><span class="nw">Designed &amp; built by Anjan Patel</span> <span class="nw"><span class="csep">· </span>© <span id="cy">2026</span></span></div>
    </footer>
  </div>
</main>

<script>
(function () {
  var clock = document.getElementById('clock');
  if (clock && window.Intl) {
    var fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Edmonton',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
    var tick = function () {
      var parts = fmt.formatToParts(new Date());
      var get = function (t) {
        for (var i = 0; i < parts.length; i++) { if (parts[i].type === t) return parts[i].value; }
        return '00';
      };
      clock.textContent = get('hour') + ':' + get('minute') + ':' + get('second') + ' ' + get('dayPeriod');
    };
    tick();
    setInterval(tick, 1000);
  }

  var cy = document.getElementById('cy');
  if (cy) cy.textContent = new Date().getFullYear();
})();
</script>
</body>
