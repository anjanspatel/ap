<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B111A" />
<title>Page not found · Anjan Patel</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,900&display=swap" />
<style>
  :root{--bg:#0B111A;--accent:#19D3E6;--muted:#94A3B8;--line:#2B3A4C}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:#fff;
    font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  main{
    min-height:100vh; min-height:100dvh; padding:16px;
    display:flex; align-items:center; justify-content:center;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:80px 80px,80px 80px,16px 16px,16px 16px;
    background-position:center center;
  }
  .sheet{
    width:100%; max-width:640px; border:1px solid var(--line);
    background:rgba(18,21,30,.6);
    min-width:0;
  }
  .strip{
    display:flex; justify-content:space-between; gap:12px;
    padding:12px 20px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
  }
  .strip:first-child{border-bottom:1px solid var(--line)}
  .strip:last-child{border-top:1px solid var(--line)}
  .strip .c{color:var(--accent)}
  .body{padding:40px 20px 36px; text-align:center}
  .code{
    font-family:"Cabinet Grotesk","Inter",system-ui,sans-serif; font-weight:900;
    font-size:clamp(5rem, 26vw, 10rem); line-height:1; margin:0;
    color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); letter-spacing:-.04em;
  }
  h1{
    font-family:"Cabinet Grotesk","Inter",system-ui,sans-serif; font-weight:700;
    font-size:clamp(1.25rem, 5vw, 1.75rem); margin:16px 0 8px;
  }
  p{color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 28px}
  a.btn{
    display:inline-block; padding:14px 22px; border:1px solid var(--line);
    color:#fff; text-decoration:none; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    transition:background .15s, color .15s, border-color .15s;
  }
  a.btn:hover{background:var(--accent); border-color:var(--accent); color:var(--bg)}
  a.btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .copy{text-align:right} .copy .nw{white-space:nowrap} .copy .csep{display:none}
  @media(min-width:600px){ .copy .csep{display:inline} }
  @media(max-width:480px){ .strip{font-size:9px; padding:10px 14px} .strip .sm-hide{display:none} }
  @media(max-width:375px){
    .strip{flex-wrap:wrap; gap:8px}
    .copy .nw{white-space:normal}
  }
</style>
</head>
<body>
<main>
  <div class="sheet">
    <div class="strip"><span><span class="c">DWG_NO</span> AP-404</span><span>SHEET NOT ISSUED</span></div>
    <div class="body">
      <div class="code" aria-hidden="true">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be old or mistyped.</p>
      <a class="btn" href="/">Go to anjanpatel.ca</a>
    </div>
    <div class="strip"><span class="sm-hide">anjanpatel.ca</span><span id="copyright" class="copy"><span class="nw">Designed &amp; built by Anjan Patel</span> <span class="nw"><span class="csep">· </span>© <span id="cy">2026</span></span></span></div>
  </div>
</main>
<script>
(function () {
  var cy = document.getElementById('cy');
  if (cy) cy.textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
